[env:t-display-s3-pro]
platform  = espressif32
board     = esp32-s3-devkitm-1
framework = arduino

; ── Board hardware ─────────────────────────────────────────────────────────────
board_build.mcu          = esp32s3
board_build.f_cpu        = 240000000L
board_build.flash_size   = 16MB
board_build.flash_mode   = qio
board_build.psram        = enabled
board_build.arduino.memory_type = qio_opi   ; ESP32-S3R8 uses Octal PSRAM
board_upload.flash_size  = 16MB

; ── Partition table: 6MB app / 8MB LittleFS (for future data files) ───────────
board_build.partitions   = partitions_custom.csv

; ── USB CDC (native USB on ESP32-S3) ─────────────────────────────────────────
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMQTT_MAX_PACKET_SIZE=1024
    -DARDUINO_USB_MODE=1
    ; Display pin definitions (ST7796 via GPSPI2)
    -DTFT_MOSI=17
    -DTFT_SCLK=18
    -DTFT_MISO=8
    -DTFT_CS=39
    -DTFT_DC=9
    -DTFT_RST=47
    -DTFT_BL=48
    ; Touch + sensors share I2C bus (SDA=5, SCL=6)
    ; CST226SE touch: RST=13, IRQ=21 — handled via SensorLib TouchDrvCST226
    -DTOUCH_SDA=5
    -DTOUCH_SCL=6
    -DTOUCH_RST=13
    -DTOUCH_IRQ=21
    ; LTR-553 light+prox sensor (same I2C bus)
    -DLTR553_SDA=5
    -DLTR553_SCL=6
    ; Display resolution
    -DSCREEN_W=480
    -DSCREEN_H=222
    ; Workaround: missing constant in framework-arduinoespressif32 dev build
    -DCFG_TUD_ENDOINT0_SIZE=64
    ; TFT_eSPI: force SPI_PORT=2 (GPSPI2) for ESP32-S3/IDF5
    ; Without this, FSPI=0 maps to REG_SPI_BASE(0)=0 → crash at address 0x10
    -DUSE_FSPI_PORT
    ; TFT_eSPI user setup injected via build flags
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=222
    -DTFT_HEIGHT=480
    -DTFT_INVERSION_ON
    -DCGRAM_OFFSET
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000

upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

; ── Libraries ──────────────────────────────────────────────────────────────────
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
    arduino-libraries/NTPClient @ ^3.2.1
    knolleary/PubSubClient @ ^2.8       ; MQTT → HA alerts
    ; LTR553 light sensor + CST226SE touch
    https://github.com/lewisxhe/SensorLib.git
